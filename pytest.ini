[pytest]
# Root directories pytest will search for tests
testpaths = tests

# Automatically use asyncio for async tests (pytest-asyncio >= 0.21)
asyncio_mode = auto

# Output options
addopts =
    --tb=short
    --strict-markers

# Suppress third-party deprecation warnings that don't affect test correctness
filterwarnings =
    ignore::DeprecationWarning:starlette.*
